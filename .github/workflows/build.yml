name: Build and deploy web flasher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          # The container runs as root on a runner-owned checkout; let git (app version) read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py --preview set-target esp32s31
          idf.py --preview build

      - name: Collect firmware and web flasher
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/make_web_flasher.py \
            --build-dir build \
            --web-dir web \
            --out-dir _site \
            --version "${GITHUB_SHA::7}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s31-${{ github.sha }}
          path: _site/firmware/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
