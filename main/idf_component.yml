dependencies:
  espressif/esp32_s31_korvo_1:
    version: "1.1.0"
  espressif/human_face_detect:
    version: "0.5.0"
  # esp_lvgl_port 2.9.0 needs LV_COLOR_FORMAT_RGB565_SWAPPED (LVGL >= 9.3).
